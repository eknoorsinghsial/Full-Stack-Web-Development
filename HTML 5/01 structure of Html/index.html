<!DOCTYPE html>         <!--This tells the browser what type of document to expect; Here its HTML document-->
                        <!--This must appear only once at the top of page, before HTML tag-->
                        <!-- <!DOCTYPE> declaration is not case sensitive  -->
<html lang="en">
                        <!--html lang="en": is the language attribute and tells the browser the default language-->
                        <!-- <html> tag represents the root of an HTML document or we can say it is the conatiner for all other html elements(except <!DOCTYPE> tag)-->
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">      
                        <!-- <head>: This is head sextion of the HTML document,which conatins meta-information about the document-->
                        <!-- This conatins Title of web page that appears in the web browser's title bar or tab.-->
        <title> Hello, World!</tiitle>
                        <!-- <title>: This is the title tag, which sets the title of the web page.In this example,it's set to "Hello,World!"-->
                        <!-- This is like a label for a webpage.It should only have words, and it appears at the top of your web browser or on the tab of the webpage.-->
                        <!-- We can have only one <title> atg in our webpage-->
                    </head>

    <body>               
                        <!-- <body>: This is the body section of the HTML document, which contains the visible content of the webpage, such as headings,paragraphs, and more.-->
        <h1>Hello, World!</h1>
                        <!-- <h1>: This is a heading tag,used to define a top-level heading.In this example,it displays the text "Hello,World!" as a heading.-->
        <p>This is my first HTML page,</p>
                        <!-- <p>: This is a paragraph tag,used to defne a paragraphof text.In this example,it displays the text "This is my first HTML page." as a paragraph-->
    </body>
</html>
