<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Tags</title>
</head>
<body>
    <div>
        Some <b>Bold</b> Text       <!-- To bold text use <b> tag -->
        
        <br>                        <!-- To enter a new line use <br> tag -->
        
        Some <i>Italic</i> Text     <!-- To format the text into italic form use <i> tag -->
        
        <br>
        
        Some <mark>Highlighted</mark> Text  <!-- To get highlighted text use <mark> tag -->
        
        <br>
        
        Some <ins>Underlined</ins> Text     <!-- To underline the text use <ins> tag -->
        
        <br>
        
        Formula = MC<sup>2</sup>            <!-- To superscript the text use <sup> tag -->
        
        <br>
        
        Formula = H<sub>2</sub>O            <!-- To subscript the text use <sub> tag -->
        
        <br>

        <del>Strikethrough</del>            <!-- To strike through the text use <del> tag -->
    
        <br>

        This is a sentence with <small>small</small> and <big>big</big> text        <!-- To make text smmall and big relatively use <small> and <big> text -->

        <br>

        <strong>emphasizing text</strong>           <!-- To emphasize as well as bold a text use <strong> tag -->

        <br> 

        <em>empahsize</em>                          <!-- To italicize and emphasize text use <em> tag -->

        <hr>                                        <!-- To get a thematic break in an HTML page , often displayed as an horizontal line use <hr> tag-->

        This is a <span>span</span> content         <!-- To highlight and emphasize without affecting the other content--> 



    </div>
</body>
</html>
