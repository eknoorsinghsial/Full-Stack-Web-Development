<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <!--Html attributes -> These are extra properties that we can pass to our html elements-->
        <ul type="circle">              <!--Here type is the property of <ul> which is an html element-->
            <li>List item 1</li>
            <li>List item 2</li>
        </ul>
        <ol type="A">
            <li>List item 1</li>        <!--A List item 1-->
            <li>List item 2</li>        <!--B List item 2-->
        </ol>
        <ol type="none" id="unique">
            <li class="c1">List item 1</li>        <!--1 List item 1-->
            <li class="c2">List item 2</li>        <!--2 List item 2-->
        </ol>
        <ol type="1" start="0">
            <li>List item 1</li>        <!--0 List item 1-->
            <li>List item 2</li>        <!--1 List item 2-->
        </ol>
        <ol type="1" start="0" reversed=""true>
            <li>List item 1</li>        <!--   0 List item 1-->
            <li>List item 2</li>        <!--  -1 List item 2-->
        </ol>
    </div>
</body>
</html>
