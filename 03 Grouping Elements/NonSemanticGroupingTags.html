<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: purple;
            width: 50%;                     /* This halves the widthb of the div block and purple coloure is only filled in half of the block*/
        }
        span{
            background-color: yellow;       /* In this we can not change the width because her by default the lenght in line and not block*/
        }
    </style>
</head>
<body>
    <div class="container">                     <!-- This gives the whole block content coloured-->
        <p>Lorem Ipsum 1</p>
        <p>Lorem Ipsum 2</p>
        <p>Lorem Ipsum 3</p>
    </div>
    <div>
        <span>My Name is eknoor Singh sial</span>       <!-- This gives the inline content coloured -->
    </div>
</body>
</html>
