<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="containe"></div>        <!--1) Creating a class in a div using    .container -->

    <p id="main"></p>                   <!--2) creating an id in a tag using     p#main  -->
    <div id="kick"></div>               <!--Creating an id in a tag using     div#main  -->

    <ul>                                <!--3) Creating unordered list using     ul>li*4  -->
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    
    <form action="" id="search" class="formClass"></form>       <!--4) creating form using   form#idname.classname-->

    <ul>                                 <!--5) Creating ul with incremented class using      ul>li.classname$*nummberOfLists-->
        <li class="item1"></li>
        <li class="item2"></li>
        <li class="item3"></li>
        <li class="item4"></li>
    </ul>

    <ul>                                <!--6) Creating ul with starting class from no. 3 and counts upto next to 10 elements using         ul>li.classname$@3*10  -->
        <lis class="clasname3"></lis>
        <lis class="clasname4"></lis>
        <lis class="clasname5"></lis>
        <lis class="clasname6"></lis>
        <lis class="clasname7"></lis>
        <lis class="clasname8"></lis>
        <lis class="clasname9"></lis>
        <lis class="clasname10"></lis>
        <lis class="clasname11"></lis>
        <lis class="clasname12"></lis>
    </ul>

</body>
